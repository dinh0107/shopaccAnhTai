<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="webGlow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g stroke="#e2e8f0" stroke-width="1.8" fill="none" opacity="0.85" filter="url(#webGlow)">
    <!-- Radial spokes from corner (0,0) -->
    <line x1="0" y1="0" x2="200" y2="0" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="195" y2="40"/>
    <line x1="0" y1="0" x2="175" y2="90"/>
    <line x1="0" y1="0" x2="140" y2="140"/>
    <line x1="0" y1="0" x2="90" y2="175"/>
    <line x1="0" y1="0" x2="40" y2="195"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke-width="2.5"/>

    <!-- Concentric spiral rings -->
    <path d="M 0,35 Q 20,33 33,20 Q 35,0 35,0"/>
    <path d="M 0,70 Q 20,68 35,62 Q 55,55 62,35 Q 68,20 70,0"/>
    <path d="M 0,110 Q 30,105 52,98 Q 80,85 98,52 Q 105,30 110,0"/>
    <path d="M 0,150 Q 35,145 68,132 Q 105,115 132,68 Q 145,35 150,0"/>
    <path d="M 0,195 Q 40,188 85,170 Q 135,145 170,85 Q 188,40 195,0"/>
  </g>

  <!-- Cute Spider dangling -->
  <line x1="135" y1="65" x2="135" y2="125" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="135" cy="132" r="7" fill="#1e1b4b" stroke="#7e22ce" stroke-width="1.5"/>
  <circle cx="135" cy="124" r="4.5" fill="#1e1b4b"/>
  <!-- Spider eyes -->
  <circle cx="133.5" cy="123" r="1" fill="#f43f5e"/>
  <circle cx="136.5" cy="123" r="1" fill="#f43f5e"/>
  <!-- Spider legs -->
  <path d="M 130,129 Q 120,124 121,118" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
  <path d="M 130,132 Q 118,131 116,126" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
  <path d="M 130,135 Q 119,139 122,146" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
  <path d="M 140,129 Q 150,124 149,118" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
  <path d="M 140,132 Q 152,131 154,126" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
  <path d="M 140,135 Q 151,139 148,146" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>
</svg>
