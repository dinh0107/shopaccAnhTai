<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="jackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="60%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <filter id="pumpkinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#pumpkinShadow)">
    <!-- Stem -->
    <path d="M 80,45 C 80,30 92,20 102,22 C 104,26 98,34 92,42 Z" fill="url(#stemGrad)" stroke="#1a2e05" stroke-width="1.5"/>
    <!-- Pumpkin Ribs -->
    <!-- Left outer lobe -->
    <ellipse cx="48" cy="88" rx="30" ry="42" fill="url(#pumpkinGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <!-- Right outer lobe -->
    <ellipse cx="112" cy="88" rx="30" ry="42" fill="url(#pumpkinGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <!-- Inner left lobe -->
    <ellipse cx="64" cy="90" rx="28" ry="46" fill="url(#pumpkinGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <!-- Inner right lobe -->
    <ellipse cx="96" cy="90" rx="28" ry="46" fill="url(#pumpkinGrad)" stroke="#7c2d12" stroke-width="1.5"/>
    <!-- Center lobe -->
    <ellipse cx="80" cy="92" rx="26" ry="48" fill="url(#pumpkinGrad)" stroke="#7c2d12" stroke-width="1.5"/>

    <!-- Carved Eyes -->
    <polygon points="56,76 68,66 70,82" fill="url(#jackGlow)" stroke="#451a03" stroke-width="1"/>
    <polygon points="104,76 92,66 90,82" fill="url(#jackGlow)" stroke="#451a03" stroke-width="1"/>
    <!-- Carved Nose -->
    <polygon points="80,82 74,92 86,92" fill="url(#jackGlow)" stroke="#451a03" stroke-width="1"/>
    <!-- Carved Creepy Smile with Teeth -->
    <path d="M 50,102 Q 80,132 110,102 Q 102,112 96,104 Q 92,118 88,105 Q 80,122 74,106 Q 68,114 62,103 Z" fill="url(#jackGlow)" stroke="#451a03" stroke-width="1.5"/>
  </g>
</svg>
