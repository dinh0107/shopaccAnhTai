<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <filter id="sunHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#sunHalo)">
    <!-- Sun Rays -->
    <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="20" x2="80" y2="8"/>
      <line x1="80" y1="140" x2="80" y2="152"/>
      <line x1="20" y1="80" x2="8" y2="80"/>
      <line x1="140" y1="80" x2="152" y2="80"/>
      <line x1="38" y1="38" x2="28" y2="28"/>
      <line x1="122" y1="122" x2="132" y2="132"/>
      <line x1="122" y1="38" x2="132" y2="28"/>
      <line x1="38" y1="122" x2="28" y2="132"/>
    </g>

    <!-- Sun Core -->
    <circle cx="80" cy="80" r="46" fill="url(#sunGlow)" stroke="#f59e0b" stroke-width="2"/>

    <!-- Sunglasses on the Sun -->
    <!-- Left Lens -->
    <path d="M 52,70 L 74,70 C 74,86 52,86 52,70 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Right Lens -->
    <path d="M 86,70 L 108,70 C 108,86 86,86 86,70 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Bridge -->
    <line x1="74" y1="72" x2="86" y2="72" stroke="#0f172a" stroke-width="3"/>
    <!-- Lens Reflection -->
    <line x1="56" y1="73" x2="68" y2="82" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="73" x2="102" y2="82" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheerful Smile -->
    <path d="M 66,95 Q 80,108 94,95" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="56" cy="94" r="5" fill="#f43f5e" opacity="0.6"/>
    <circle cx="104" cy="94" r="5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>
