<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 220" width="120" height="220">
  <defs>
    <linearGradient id="lanternRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lanternGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="lanternGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#lanternGlow)">
    <!-- Hanging cord -->
    <line x1="60" y1="0" x2="60" y2="40" stroke="#facc15" stroke-width="2.5"/>

    <!-- Top Cap (Gold) -->
    <rect x="42" y="38" width="36" height="12" rx="4" fill="url(#lanternGold)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Lantern Main Body (Red Oval / Sphere) -->
    <ellipse cx="60" cy="105" rx="46" ry="58" fill="url(#lanternRed)" stroke="#7f1d1d" stroke-width="2"/>

    <!-- Gold Ribs / Segments on Lantern -->
    <ellipse cx="60" cy="105" rx="30" ry="58" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.75"/>
    <ellipse cx="60" cy="105" rx="14" ry="58" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.75"/>
    <line x1="60" y1="47" x2="60" y2="163" stroke="#facc15" stroke-width="1.5" opacity="0.8"/>

    <!-- Central Character / Ornament -->
    <circle cx="60" cy="105" r="15" fill="url(#lanternGold)" stroke="#78350f" stroke-width="1"/>
    <text x="60" y="111" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="'Times New Roman', serif">春</text>

    <!-- Bottom Cap (Gold) -->
    <rect x="44" y="160" width="32" height="10" rx="3" fill="url(#lanternGold)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Gold Tassels hanging down -->
    <line x1="60" y1="170" x2="60" y2="182" stroke="#eab308" stroke-width="3"/>
    <circle cx="60" cy="184" r="4" fill="url(#lanternGold)"/>
    <!-- Tassel strands -->
    <path d="M 52,186 L 46,218 M 56,186 L 53,220 M 60,186 L 60,220 M 64,186 L 67,220 M 68,186 L 74,218" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
