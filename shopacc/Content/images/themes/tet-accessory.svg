<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="apricotPetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="peachPetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="60%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <linearGradient id="redSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="tetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#991b1b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tetShadow)" transform="rotate(-15, 100, 100)">
    <!-- Branch (Wood) -->
    <path d="M 40,140 Q 80,105 130,85 Q 160,75 180,65" fill="none" stroke="#582f0e" stroke-width="5" stroke-linecap="round"/>
    <path d="M 90,105 Q 110,80 120,60" fill="none" stroke="#582f0e" stroke-width="3" stroke-linecap="round"/>

    <!-- Red Envelope / Li Xi -->
    <g transform="translate(60, 110) rotate(18) scale(0.75)">
      <rect x="0" y="0" width="38" height="60" rx="4" fill="url(#redSilk)" stroke="#facc15" stroke-width="2"/>
      <!-- Flap curve -->
      <path d="M 0,0 Q 19,15 38,0" fill="#991b1b" stroke="#facc15" stroke-width="1.5"/>
      <!-- Gold medallion on envelope -->
      <circle cx="19" cy="30" r="10" fill="url(#goldTassel)" stroke="#78350f" stroke-width="1"/>
      <text x="19" y="34" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Arial">福</text>
      <!-- Gold coin hanging -->
      <circle cx="19" cy="68" r="5" fill="url(#goldTassel)"/>
    </g>

    <!-- Mai Flower (Yellow) 1 - Large -->
    <g transform="translate(130, 85)">
      <circle cx="0" cy="-15" r="12" fill="url(#apricotPetal)"/>
      <circle cx="14" cy="-5" r="12" fill="url(#apricotPetal)"/>
      <circle cx="9" cy="13" r="12" fill="url(#apricotPetal)"/>
      <circle cx="-9" cy="13" r="12" fill="url(#apricotPetal)"/>
      <circle cx="-14" cy="-5" r="12" fill="url(#apricotPetal)"/>
      <!-- Center pistils -->
      <circle cx="0" cy="0" r="6" fill="#ea580c"/>
      <circle cx="-3" cy="-3" r="1.5" fill="#fef08a"/>
      <circle cx="3" cy="-3" r="1.5" fill="#fef08a"/>
      <circle cx="0" cy="3" r="1.5" fill="#fef08a"/>
    </g>

    <!-- Peach Flower (Pink) 2 -->
    <g transform="translate(95, 100) scale(0.85)">
      <circle cx="0" cy="-14" r="11" fill="url(#peachPetal)"/>
      <circle cx="13" cy="-4" r="11" fill="url(#peachPetal)"/>
      <circle cx="8" cy="12" r="11" fill="url(#peachPetal)"/>
      <circle cx="-8" cy="12" r="11" fill="url(#peachPetal)"/>
      <circle cx="-13" cy="-4" r="11" fill="url(#peachPetal)"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="5.5" fill="#be123c"/>
      <circle cx="0" cy="0" r="2.5" fill="#fef08a"/>
    </g>

    <!-- Mai Flower 3 - Small Bud -->
    <g transform="translate(170, 68) scale(0.6)">
      <circle cx="0" cy="-14" r="11" fill="url(#apricotPetal)"/>
      <circle cx="13" cy="-4" r="11" fill="url(#apricotPetal)"/>
      <circle cx="8" cy="12" r="11" fill="url(#apricotPetal)"/>
      <circle cx="-8" cy="12" r="11" fill="url(#apricotPetal)"/>
      <circle cx="-13" cy="-4" r="11" fill="url(#apricotPetal)"/>
      <circle cx="0" cy="0" r="5" fill="#ea580c"/>
    </g>
    <!-- Little green bud leaves -->
    <ellipse cx="120" cy="62" rx="4" ry="8" fill="#65a30d" transform="rotate(45, 120, 62)"/>
    <ellipse cx="152" cy="74" rx="4" ry="7" fill="#65a30d" transform="rotate(-30, 152, 74)"/>
  </g>
</svg>
