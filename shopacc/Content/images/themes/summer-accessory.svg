<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="oceanBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="flowerPetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="summerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#summerShadow)" transform="rotate(-10, 100, 100)">
    <!-- Beach Straw Hat Dome -->
    <path d="M 60,110 C 60,60 140,60 140,110 Z" fill="url(#strawGrad)" stroke="#a16207" stroke-width="2"/>
    <!-- Dome texture lines -->
    <path d="M 72,110 C 74,78 126,78 128,110" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>
    <path d="M 85,110 C 87,90 113,90 115,110" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.6"/>

    <!-- Hat Ribbon Band -->
    <path d="M 60,110 C 80,115 120,115 140,110 L 140,100 C 120,105 80,105 60,100 Z" fill="url(#oceanBand)" stroke="#0369a1" stroke-width="1"/>

    <!-- Hat Brim (Wide & Wavy) -->
    <ellipse cx="100" cy="115" rx="80" ry="24" fill="url(#strawGrad)" stroke="#a16207" stroke-width="2.5"/>
    <!-- Brim inner shadow -->
    <ellipse cx="100" cy="113" rx="72" ry="18" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5"/>

    <!-- Tropical Hibiscus Flower on Hat -->
    <g transform="translate(138, 92) scale(0.65)">
      <!-- Petals -->
      <circle cx="0" cy="-18" r="14" fill="url(#flowerPetal)"/>
      <circle cx="17" cy="-5" r="14" fill="url(#flowerPetal)"/>
      <circle cx="11" cy="16" r="14" fill="url(#flowerPetal)"/>
      <circle cx="-11" cy="16" r="14" fill="url(#flowerPetal)"/>
      <circle cx="-17" cy="-5" r="14" fill="url(#flowerPetal)"/>
      <!-- Flower Center -->
      <circle cx="0" cy="0" r="7" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="8" y2="-12" stroke="#ea580c" stroke-width="2"/>
      <circle cx="8" cy="-12" r="2.5" fill="#fef08a"/>
    </g>

    <!-- Sunglasses hanging on Hat brim -->
    <g transform="translate(68, 122) scale(0.65)">
      <!-- Left frame -->
      <path d="M 0,0 L 42,0 C 42,24 0,24 0,0 Z" fill="url(#glassLens)" stroke="#0f172a" stroke-width="3"/>
      <!-- Right frame -->
      <path d="M 52,0 L 94,0 C 94,24 52,24 52,0 Z" fill="url(#glassLens)" stroke="#0f172a" stroke-width="3"/>
      <!-- Bridge -->
      <path d="M 42,4 Q 47,-2 52,4" fill="none" stroke="#0f172a" stroke-width="3"/>
      <!-- Glass reflection line -->
      <line x1="8" y1="4" x2="28" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="60" y1="4" x2="80" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
