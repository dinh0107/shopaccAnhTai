<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hatBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hatBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="goldBuckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="magicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#581c87" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#magicShadow)" transform="rotate(-12, 100, 100)">
    <!-- Magic glow behind tip -->
    <circle cx="150" cy="40" r="28" fill="url(#purpleGlow)"/>

    <!-- Hat Cone -->
    <path d="M 45,145 Q 85,95 105,65 Q 120,40 145,35 Q 155,32 152,42 Q 140,55 125,85 Q 105,120 145,145 Z" fill="url(#hatBody)" stroke="#6b21a8" stroke-width="2"/>
    <path d="M 55,145 Q 90,105 110,75 Q 125,50 145,42" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.4"/>

    <!-- Hat Brim (Wide and Wavy) -->
    <ellipse cx="95" cy="148" rx="80" ry="24" fill="url(#hatBody)" stroke="#581c87" stroke-width="2.5"/>
    <ellipse cx="95" cy="149" rx="72" ry="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>

    <!-- Ribbon / Band -->
    <path d="M 52,143 Q 95,153 138,143 L 136,131 Q 95,140 54,131 Z" fill="url(#hatBand)"/>

    <!-- Golden Buckle -->
    <rect x="85" y="129" width="20" height="18" rx="3" fill="url(#goldBuckle)" stroke="#78350f" stroke-width="1.5"/>
    <rect x="90" y="133" width="10" height="10" rx="1" fill="#ea580c"/>

    <!-- Magic Stars -->
    <polygon points="155,28 158,34 164,35 160,39 161,45 155,42 150,45 151,39 146,35 152,34" fill="#fbbf24"/>
    <polygon points="172,48 174,52 178,53 175,56 176,60 172,58 169,60 170,56 166,53 170,52" fill="#fef08a"/>
    <circle cx="135" cy="25" r="2.5" fill="#f472b6"/>
    <circle cx="165" cy="68" r="2" fill="#c084fc"/>
  </g>
</svg>
