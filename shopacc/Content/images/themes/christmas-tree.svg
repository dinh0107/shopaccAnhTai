<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="treeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="trunkBrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="starGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="treeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14532d" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#treeGlow)">
    <!-- Tree Trunk -->
    <rect x="70" y="155" width="20" height="25" rx="3" fill="url(#trunkBrown)"/>

    <!-- Bottom Tier -->
    <polygon points="80,105 20,160 140,160" fill="url(#treeGreen)" stroke="#052e16" stroke-width="1.5"/>
    <!-- Snow on bottom tier -->
    <path d="M 20,160 Q 40,154 60,158 Q 80,152 100,158 Q 120,154 140,160 L 132,152 Q 100,146 80,148 Q 50,146 28,152 Z" fill="#f8fafc" opacity="0.85"/>

    <!-- Middle Tier -->
    <polygon points="80,70 35,115 125,115" fill="url(#treeGreen)" stroke="#052e16" stroke-width="1.5"/>
    <!-- Snow on middle tier -->
    <path d="M 35,115 Q 55,110 80,113 Q 105,110 125,115 L 118,109 Q 95,104 80,106 Q 60,104 42,109 Z" fill="#f8fafc" opacity="0.85"/>

    <!-- Top Tier -->
    <polygon points="80,35 48,78 112,78" fill="url(#treeGreen)" stroke="#052e16" stroke-width="1.5"/>
    <!-- Snow on top tier -->
    <path d="M 48,78 Q 65,74 80,76 Q 95,74 112,78 L 106,73 Q 90,69 80,71 Q 70,69 54,73 Z" fill="#f8fafc" opacity="0.85"/>

    <!-- Garland / Tinsel Lights -->
    <path d="M 52,72 Q 80,82 108,72" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 40,110 Q 80,124 120,110" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 26,152 Q 80,170 134,152" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Christmas Ornaments (Baubles) -->
    <circle cx="60" cy="95" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
    <circle cx="100" cy="98" r="4.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
    <circle cx="75" cy="62" r="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="45" cy="140" r="5.5" fill="#ec4899" stroke="#be185d" stroke-width="1"/>
    <circle cx="85" cy="138" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
    <circle cx="115" cy="142" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

    <!-- Top Star -->
    <polygon points="80,18 84,28 95,29 86,36 89,47 80,41 71,47 74,36 65,29 76,28" fill="url(#starGold)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Gift Boxes under tree -->
    <rect x="35" y="162" width="24" height="20" rx="2" fill="#ef4444"/>
    <line x1="47" y1="162" x2="47" y2="182" stroke="#facc15" stroke-width="3"/>
    <line x1="35" y1="172" x2="59" y2="172" stroke="#facc15" stroke-width="3"/>

    <rect x="98" y="160" width="22" height="22" rx="2" fill="#3b82f6"/>
    <line x1="109" y1="160" x2="109" y2="182" stroke="#f8fafc" stroke-width="3"/>
    <line x1="98" y1="171" x2="120" y2="171" stroke="#f8fafc" stroke-width="3"/>
  </g>
</svg>
